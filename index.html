<title>Project-Y</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#040806"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Project-Y"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="project-y-180.png"><link rel="icon" type="image/png" href="project-y-192.png">
<style>
:root{color-scheme:dark;--page:#040806;--ink:#f1f5f3;--ink2:#b4beb9;--rand:rgba(255,255,255,.1);--rand2:rgba(255,255,255,.16);
--crit:#ff7b8c;--mint:#4ff0b0}
*{box-sizing:border-box}
html{background:var(--page);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--ink);
font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom))
max(20px,env(safe-area-inset-left));
background:radial-gradient(85% 42% at 50% 18%,rgba(56,150,104,.3),transparent 72%),
radial-gradient(90% 50% at -10% 105%,rgba(70,112,102,.32),transparent 70%),
radial-gradient(60% 40% at 110% 70%,rgba(30,90,66,.18),transparent 70%),
linear-gradient(180deg,#06100b,#030605 60%,#020403)}
.tor{position:relative;width:100%;max-width:380px}
.stapel{position:absolute;left:0;right:0;top:0;height:200px;pointer-events:none}
.stapel i{position:absolute;display:block;border-radius:22px;border:1px solid var(--rand);
box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 40px -22px #000}
.stapel i:nth-child(1){top:44px;left:15%;right:15%;height:150px;transform:rotate(-3.5deg);opacity:.55;
background:linear-gradient(160deg,rgba(150,200,175,.12),rgba(255,255,255,.02)),rgba(9,18,14,.8)}
.stapel i:nth-child(2){top:22px;left:9%;right:9%;height:150px;transform:rotate(2.5deg);opacity:.8;
background:linear-gradient(160deg,rgba(150,205,178,.15),rgba(255,255,255,.03)),rgba(10,22,16,.85)}
.stapel i:nth-child(3){top:0;left:3%;right:3%;height:152px;transform:rotate(-1deg);border-color:rgba(190,240,215,.22);
background:linear-gradient(165deg,rgba(120,210,165,.32) 0%,rgba(52,120,88,.22) 45%,rgba(20,60,42,.3) 100%),rgba(10,24,17,.88);
box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 40px -10px rgba(79,240,176,.35),0 28px 44px -24px #000}
form{position:relative;z-index:1;width:100%;display:flex;flex-direction:column}
form img{align-self:center;display:block;width:64px;height:64px;margin:22px 0 0;border-radius:16px;
box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 30px -8px rgba(79,240,176,.65)}
h1{margin:12px 0 0;text-align:center;font-size:28px;line-height:36px;font-weight:500;letter-spacing:-.02em}
p{margin:64px 6px 20px;text-align:center;color:var(--ink2);font-size:14px}
input[type=password]{width:100%;min-height:54px;font:inherit;font-size:17px;padding:0 18px;border-radius:16px;
border:1px solid var(--rand2);background:rgba(0,0,0,.32);color:var(--ink)}
input[type=password]::placeholder{color:#8f9a94}
label{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:12px;min-height:54px;
margin:10px 0 16px;padding:0 12px 0 18px;border-radius:16px;border:1px solid var(--rand);color:var(--ink2);font-size:15px;
background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));cursor:pointer}
label input{-webkit-appearance:none;appearance:none;flex:none;width:48px;height:28px;margin:0;border-radius:999px;cursor:pointer;
background:radial-gradient(circle at 14px 50%,#fff 10px,transparent 11px),#3a4440;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
label input:checked{background:radial-gradient(circle at 34px 50%,#fff 10px,transparent 11px),#1d9a62}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
button{width:100%;min-height:56px;font:inherit;font-weight:650;font-size:17px;padding:0 16px;border:0;border-radius:16px;
color:#07110c;background:linear-gradient(180deg,#fff,#e2e9e5);box-shadow:0 0 30px -6px rgba(255,255,255,.45);cursor:pointer}
button:disabled{opacity:.6}
#fehler{color:var(--crit);font-size:14px;min-height:1.5em;margin:12px 0 0;text-align:center}
</style></head>

<main class="tor">
<div class="stapel" aria-hidden="true"><i></i><i></i><i></i></div>

</form>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function hex(s){var a=new Uint8Array(s.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a;}
async function oeffnen(bits){
  var enc=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  var mac=await crypto.subtle.importKey('raw',bits.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  var iv=b64(BOX.iv),ct=b64(BOX.ct),data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  if(!await crypto.subtle.verify('HMAC',mac,b64(BOX.mac),data))throw new Error('falsch');
  var plain=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},enc,ct);
  var html=new TextDecoder().decode(plain);
  // für diese Sitzung merken: Eingaben in der App (Spannen, Protokoll 19) werden damit verschlüsselt
  try{sessionStorage.setItem('catalyst-sitzung',btoa(String.fromCharCode.apply(null,bits)));}catch(_){}
  // erst ersetzen, wenn die Startseite fertig geladen ist; sonst hängt document.write das Dashboard nur an
  if(document.readyState==='loading'){await new Promise(function(r){document.addEventListener('DOMContentLoaded',r);});}
  document.open();document.write(html);document.close();
}
async function ableiten(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(SALT),iterations:ITER,hash:'SHA-256'},base,512));
}
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
(async function(){
  var gespeichert=null;try{gespeichert=localStorage.getItem(KEY_NAME);}catch(_){}
  if(gespeichert){try{await oeffnen(b64(gespeichert));return;}catch(_){try{localStorage.removeItem(KEY_NAME);}catch(e){}}}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();var los=document.getElementById('los'),fehler=document.getElementById('fehler');
    fehler.textContent='';los.disabled=true;los.textContent='Prüfe …';
    try{var bits=await ableiten(document.getElementById('pw').value);
      if(document.getElementById('merken').checked){try{localStorage.setItem(KEY_NAME,btoa(String.fromCharCode.apply(null,bits)));}catch(_){}}
      await oeffnen(bits);
    }catch(err){fehler.textContent='Passwort falsch – bitte erneut versuchen.';los.disabled=false;los.textContent='Öffnen';}
  });
})();
