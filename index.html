<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catalyst Dashboard</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#060a19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Catalyst"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--page:#060a19;--surface:rgba(16,22,48,.86);--ink:#eef1ff;--ink2:#a9b0d3;
--border:rgba(130,145,255,.17);--crit:#ff5f7e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);
background-image:radial-gradient(700px 440px at 100% -4%,rgba(70,90,255,.30),transparent 62%);background-repeat:no-repeat;
color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;
box-shadow:0 12px 32px rgba(0,0,0,.3)}
img{width:56px;height:56px;border-radius:14px;display:block;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--ink2);font-size:14px}
input[type=password]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--border);
background:var(--page);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:650;padding:13px;border:0;border-radius:999px;color:#fff;
background:linear-gradient(90deg,#3b82f6,#8b5cf6);box-shadow:0 8px 24px rgba(99,102,241,.4)}
button:disabled{opacity:.6}
#fehler{color:var(--crit);font-size:14px;min-height:1.5em;margin:10px 0 0}
</style></head>
<body>
<form id="f" autocomplete="on">
<img src="icon-192.png" alt="">
<h1>Catalyst Dashboard</h1>
<p>Stand 23.10.2026. Der Inhalt ist verschlüsselt; nur mit deinem Passwort lesbar.</p>
<input type="text" name="username" value="catalyst" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
<label><input id="merken" type="checkbox" checked> Auf diesem Gerät merken</label>
<button id="los" type="submit">Öffnen</button>
<div id="fehler" role="alert"></div>
</form>

    try{var bits=await ableiten(document.getElementById('pw').value);
      if(document.getElementById('merken').checked){try{localStorage.setItem(KEY_NAME,btoa(String.fromCharCode.apply(null,bits)));}catch(_){}}
      await oeffnen(bits);
    }catch(err){fehler.textContent='Passwort falsch – bitte erneut versuchen.';los.disabled=false;los.textContent='Öffnen';}
  });
})();
</script>
